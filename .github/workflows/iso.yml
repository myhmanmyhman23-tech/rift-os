name: Build RIFT OS ISO
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a prerelease after successful build
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: rift-iso-${{ github.ref }}
  cancel-in-progress: false
jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check source and version
        run: |
          npm test
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo 'Git tag must match package.json version'; exit 1
          fi
          echo "RIFT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare disposable build runner
        run: |
          # Remove only preinstalled SDKs on this disposable GitHub runner.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools qemu-system-x86 curl shellcheck
          shellcheck -x -e SC1091 linux/*.sh build/*.sh release/*.sh
          df -h /mnt
      - name: Build and smoke-test ISO
        run: sudo --preserve-env=PATH bash build/build-iso.sh
      - name: Publish versioned prerelease
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RIFT_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; never overwrite published builds.'; exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
            --title "RIFT OS $RIFT_VERSION" --notes-file release/NOTES.md \
            dist/*.iso.part-* dist/SHA256SUMS dist/Reassemble.ps1 dist/reassemble.sh \
            dist/DOWNLOAD.txt dist/*-boot.log dist/boot-layout.txt \
            dist/package-manifest.txt dist/flatpak-apps.txt dist/base-image.txt
      - name: Save unpublished build
        if: (!startsWith(github.ref, 'refs/tags/')) && (!inputs.publish)
        uses: actions/upload-artifact@v4
        with:
          name: rift-os-${{ env.RIFT_VERSION }}-amd64
          path: dist/
          retention-days: 1
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-diagnostics
          path: |
            dist/*.log
            dist/*.txt
          if-no-files-found: ignore
          retention-days: 3
